<!DOCTYPE html>                              <!-- Говорит браузеру: это HTML5-документ -->
<html lang="ru">                             <!-- Корень страницы, lang="ru" — язык русский -->
<head>                                       <!-- Голова: метаданные, не видно на странице -->
  <meta charset="utf-8">                     <!-- Кодировка UTF-8, чтобы русский текст не ломался -->
  <title>Google</title>                      <!-- Название вкладки браузера -->

  <style>                                    <!-- Здесь начинается CSS (стили) -->
    body {                                   /* Селектор: тег <body> */
      margin: 0;                             /* Убираем стандартный отступ браузера вокруг страницы */
    }

    .page {                                  /* Селектор: элементы с class="page" */
      display: flex;                         /* Делает .page флекс-контейнером (flexbox-гайд) */
      flex-direction: column;                /* Дочерние блоки встают друг под другом (гайд) */
      min-height: 100vh;                     /* Минимальная высота — вся высота экрана (гайд) */
    }

    main {                                   /* Селектор: тег <main> */
      flex: 1;                               /* Растягивает main на всё свободное место (гайд) */
      display: flex;                         /* main тоже становится флекс-контейнером */
      flex-direction: column;                /* Внутри main — колонка */
      justify-content: center;               /* Центрирование по основной оси (гайд) */
      align-items: center;                   /* Центрирование по поперечной оси (гайд) */
      gap: 24px;                             /* Отступ между дочерними элементами (гайд) */
    }

    h1 {                                     /* Селектор: заголовок <h1> */
      font-size: 64px;                       /* Размер шрифта (НЕ из материалов) */
      margin: 0;                             /* Убираем стандартный отступ заголовка (НЕ из материалов) */
      letter-spacing: -2px;                  /* Уменьшаем расстояние между буквами (НЕ из материалов) */
    }

    .search-form {                           /* Селектор: элементы с class="search-form" */
      display: flex;                         /* Флекс-контейнер (гайд) */
      flex-direction: column;                /* Поле и кнопки — друг под другом (гайд) */
      align-items: center;                   /* Выравнивание по центру поперечной оси (гайд) */
      gap: 16px;                             /* Отступ между полем и кнопками (гайд) */
    }

    .search-input {                          /* Селектор: элементы с class="search-input" */
      border-radius: 24px;                   /* Скругление углов (НЕ из материалов) */
    }

    .search-input:focus {                    /* Состояние: поле получило фокус (CSS-состояния, с. 5) */
      outline: 3px solid #7a7b7b;            /* Видимая обводка при фокусе (с. 5) */
      border-color: #8484fa;                 /* Цвет рамки при фокусе (с. 5) */
    }

    .button {                                /* Селектор: элементы с class="button" */
      display: flex;                         /* Флекс-контейнер (гайд) */
      align-items: center;                   /* Центр по поперечной оси (гайд) */
      justify-content: center;               /* Центр по основной оси (гайд) */
      gap: 8px;                              /* Отступ между иконкой и текстом (гайд) */
      border-radius: 24px;                   /* Скругление углов (НЕ из материалов) */
      background: #5fa2ff;                   /* Цвет фона кнопки (CSS-состояния, с. 4) */
      color: #010443;                           /* Цвет текста — белый (НЕ из материалов) */
      transition: background-color 0.3s;     /* Плавная смена цвета за 0.3с (с. 10) */
    }

    .button:hover {                          /* Состояние: курсор над кнопкой (с. 4) */
      background: #162765;                   /* Более тёмный цвет фона (с. 4) */
    }

    .button:focus {                          /* Состояние: кнопка получила фокус (с. 5) */
      outline: 3px solid #dcfce7;            /* Видимая обводка — не убирать! (с. 5) */
    }

  </style>
</head>
<body>                                       <!-- Тело: всё видимое на странице -->
  <div class="page">                         <!-- Обёртка всей страницы, класс page (гайд) -->

    <main>                                   <!-- Главный контент страницы (semantic_html) -->
      <h1>                                   <!-- Заголовок с логотипом -->
        <span style="color: blue">G</span>   <!-- Буква G синяя, span — инлайн-элемент -->
        <span style="color: red">o</span>    <!-- Буква o красная -->
        <span style="color: rgb(255, 204, 0)">o</span> <!-- Буква o жёлтая -->
        <span style="color: blue">g</span>   <!-- Буква g синяя -->
        <span style="color: rgb(9, 183, 9)">l</span>  <!-- Буква l зелёная -->
        <span style="color: red">e</span>    <!-- Буква e красная -->
      </h1>

      <form class="search-form">             <!-- Форма поиска, класс search-form (HTML-формы) -->
        <input class="search-input" type="text" placeholder="Введите запрос"> <!-- Поле ввода текста с подсказкой -->
        <div class="buttons">                <!-- Обёртка для кнопок, класс buttons -->
          <button class="button" type="submit">Google</button>   <!-- Кнопка отправки формы (html_forms, с. 11) -->
          <button class="button" type="submit">Настройки Chrom</button>     <!-- Вторая кнопка отправки -->
        </div>
      </form>
    </main>

  </div>                                     <!-- Конец обёртки .page -->
</body>                                      <!-- Конец тела -->
</html>                                      <!-- Конец документа -->
