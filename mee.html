 <!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <title>Новая вкладка</title>
  <style>
    body {

      font-size: 75px;

      margin-top: 100px;

    }

    .button3{

      height: 30px;

    }

    .button2 {

      background-color: rgb(1, 1, 56);
      border: none;
      padding: 10px 18px;
      border-radius: 4px;
      cursor: pointer;
      justify-content: flex-end;
      align-items: end;
