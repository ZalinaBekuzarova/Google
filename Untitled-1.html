<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Новая вкладка</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header { width: 100%; }

    nav {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 15px;
      padding: 15px 20px;
    }

  nav a {
    text-decoration: none;
    color: #3c4043;
    font-size: 14px;

    border-bottom: 2px solid transparent;  /* линия невидимая */
    transition: border-color 0.3s;         /* плавное появление */
  }

  nav a:hover {
    border-bottom-color: #3c4043;          /* линия появляется при наведении */
  }

    main {
      flex: 1;
      width: 100%;
    }

    .center {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      font-size: 75px;
      text-align: center;
      margin-top: 100px;
      margin-bottom: 30px;
    }

    .search-box {      
      display: flex;
      align-items: center;
      gap: 8px;

      width: 500px;
      padding: 6px 16px;
      border: 1px solid #ccc;
      border-radius: 24px;
     background: #fff;
    }

    .search-input {
      flex: 1;              
      border: none;
      outline: none;
      font-size: 16px;
      background: transparent;
    }

    .button {
      display: flex;
      align-items: center;
      justify-content: center;

      background-color: #ffffff;
      width: 25px;
      height: 25px;
      border-radius: 50%;
    }
    .button:hover { background-color: #c4bebe; }
    .button:focus { outline: 3px solid #fcfcfc; }


    .button3 {
      display: flex;
      align-items: center;
      justify-content: center;

      background-color: #ebebeb;
      width: 105px;
      height: 35px;
      border-radius: 25px;
    }
    .button3:hover { background-color: #c4bebe; }
    .button3:focus { outline: 3px solid #fcfcfc; }
    

    .button4 {
      background-color: #ff006a;
      width: 30px;
      height: 30px;
      border-radius: 50%;
    }
    .button4:hover { background-color: #d12ed4; }
    .button4:focus { outline: 3px solid #dcfce7; }

    .button5 {
      background-color: #ffffff;
      width: 30px;
      height: 30px;
      border-radius: 50%;
    }
    .button5:hover { background-color: #8284ff; }
    .button5:focus { outline: 3px solid #868fae; }

    .button2 {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;

      background-color: rgb(145, 168, 227);
      color: rgb(1, 1, 56);
      border: none;
      padding: 6px 14px;
      cursor: pointer;
      border-radius: 30px; 
      transition: background-color 0.3s;

      margin-top: auto;
      margin-left: auto;
      margin-right: 20px;
      margin-bottom: 20px;
    }
    .button2:hover { background-color: #bfd1ef; }
    .button2:focus { outline: 3px solid #dcfce7; }


    .search-box {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .circle-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      border: none;
      background: transparent;
      cursor: pointer;
      margin-top: 30px;
    }

    .circle {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: #d8e5ff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: #000000;
      transition: background-color 0.3s;
    }

    .circle-btn:hover .circle { background-color: #9abbe8; }
    .circle-btn:focus { outline: 3px solid #dcfce7; }

    .btn-text {
      font-size: 14px;
      color: #000229;
    }
  </style>
</head>
<body>

  <header>
    <nav>
      <a href="#">Почта</a>
      <a href="#">Картинки</a>
      <button class="button5" type="button">⁝⁝⁝</button>
      <button class="button4" type="button">Б</button>
    </nav>
  </header>

  <main>
    <section class="center">
      <h1>
        <span style="color: #4285F4">G</span><span style="color: #EA4335">o</span><span style="color: #FBBC05">o</span><span style="color: #4285F4">g</span><span style="color: #34A853">l</span><span style="color: #EA4335">e</span>
      </h1>

      <div class="search-box">
        <span class="button">+</span>
        <input type="text" class="search-input" placeholder="Google">
        <span class="button">🎙️</span>
        <span class="button">📷</span>
        <span class="button3">🔍Режим ИИ</span>
      </div>

      <button class="circle-btn" type="button">
        <span class="circle">+</span>
        <span class="btn-text">Новый ярлык</span>
      </button>
    </section>
  </main>

  <button class="button2" type="button">✏️ Настройки Chrome</button>

</body>
</html>
